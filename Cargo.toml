[package]
name = "ncmdump"
version = "1.5.1"
edition = "2021"
license = "AGPL-3.0-or-later"

[lib]
name = "ncmdump"

[[bin]]
name = "ncmdump"
path = "src/main.rs"

[dependencies]
aes = "0.8"
cipher = "0.4"
base64 = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
id3 = "1.17"
metaflac = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

